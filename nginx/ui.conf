# Add these location blocks inside the existing server { listen 443 ssl; } block
# in /etc/nginx/conf.d/www.skydivingstuff.com.conf, after the location /media block.
# Auth is now handled by Flask — no htpasswd files needed.

# Static assets — no auth, long cache
location /ui/static {
    proxy_pass           http://127.0.0.1:5000;
    proxy_set_header     Host $host;
    expires              7d;
    add_header           Cache-Control "public";
}

# Upload — no body size limit, streaming, extended timeout
location /ui/upload {
    client_max_body_size    0;
    proxy_request_buffering off;

    proxy_pass           http://127.0.0.1:5000;
    proxy_set_header     Host              $host;
    proxy_set_header     X-Forwarded-Proto $scheme;
    proxy_set_header     X-Real-IP         $remote_addr;

    proxy_read_timeout   3600s;
    proxy_send_timeout   3600s;
}

# Everything else
location /ui {
    proxy_pass           http://127.0.0.1:5000;
    proxy_set_header     Host              $host;
    proxy_set_header     X-Forwarded-Proto $scheme;
    proxy_set_header     X-Real-IP         $remote_addr;

    proxy_read_timeout   370s;
    proxy_send_timeout   370s;
}
