<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skydive Mesquite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scrollbar-gutter: stable; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 15px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #e8e2d5;
      background-attachment: fixed;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: url('/ui/static/reference.jpg');
      background-size: cover;
      background-position: center;
      opacity: .20;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(rgba(90,70,30,.10) 1px, transparent 1px),
        linear-gradient(90deg, rgba(90,70,30,.10) 1px, transparent 1px),
        linear-gradient(rgba(90,70,30,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(90,70,30,.04) 1px, transparent 1px);
      background-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px;
    }

    .login-card {
      background: #f7f3ec;
      border: 1px solid #d4cbb8;
      border-top: 3px solid #c8bfad;
      border-radius: 8px;
      padding: 2.5rem 2.25rem;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 4px 24px rgba(60,40,10,.12);
    }

    .brand {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #1a1208;
      margin-bottom: .25rem;
    }
    .subtitle {
      font-size: .8rem;
      color: #6b5e4a;
      margin-bottom: 2rem;
    }

    label {
      display: block;
      font-size: .72rem;
      font-weight: 700;
      color: #6b5e4a;
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-bottom: .35rem;
    }
    input {
      font-family: inherit;
      font-size: .9rem;
      width: 100%;
      padding: .55rem .75rem;
      background: #f0ead8;
      border: 1px solid #c8bfad;
      border-radius: 4px;
      color: #1a1208;
      margin-bottom: 1.1rem;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus {
      outline: none;
      border-color: #2e7bb4;
      box-shadow: 0 0 0 3px rgba(46,123,180,.15);
    }

    .error {
      background: #f2d8d8;
      color: #5a1010;
      border: 1px solid #e8aaaa;
      border-left: 3px solid #b83232;
      border-radius: 4px;
      padding: .6rem .85rem;
      font-size: .875rem;
      margin-bottom: 1.1rem;
    }

    button {
      width: 100%;
      padding: .6rem;
      background: #2c1f0e;
      color: #f0e6d0;
      border: none;
      border-radius: 4px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: #1a1208; }
  </style>
</head>
<body>
  <div class="login-card">
    <p class="brand">✈ Skydive Mesquite</p>
    <p class="subtitle">Staff portal — sign in to continue</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/ui/login">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password">
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
