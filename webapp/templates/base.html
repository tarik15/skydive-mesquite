<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skydive Mesquite</title>
  <link rel="icon" type="image/x-icon" href="/ui/static/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/ui/static/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:           #e8e2d5;
      --card:         #f7f3ec;
      --card-border:  #d4cbb8;
      --nav:          #1a1208;
      --accent:       #2e7bb4;
      --accent-dark:  #1a5f96;
      --cta:          #c8560a;
      --cta-dark:     #a84208;
      --success:      #2d7d55;
      --danger:       #b83232;
      --danger-dark:  #8f2020;
      --text:         #1a1208;
      --muted:        #6b5e4a;
      --border:       #c8bfad;
      --shadow:       0 1px 4px rgba(60,40,10,.10), 0 4px 18px rgba(60,40,10,.07);
      --grid-color:   rgba(90,70,30,.10);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Always reserve scrollbar gutter so fixed backgrounds don't shift between pages */
    html { scrollbar-gutter: stable; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 15px;
      color: var(--text);
      line-height: 1.6;

      background-color: var(--bg);
      background-attachment: fixed;
    }

    /* Reference image + grid layered via pseudo-element */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: url('/ui/static/reference.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: .20;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px),
        linear-gradient(rgba(90,70,30,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(90,70,30,.04) 1px, transparent 1px);
      background-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px;
    }

    /* ── Nav ── */
    nav {
      background: var(--nav);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      height: 56px;
      border-bottom: 2px solid #3a2a10;
      box-shadow: 0 2px 12px rgba(0,0,0,.35);
    }
    .brand {
      color: #f0e6d0;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: .95rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-right: 2rem;
      white-space: nowrap;
    }
    nav a {
      color: #a09070;
      text-decoration: none;
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      padding: 0 .9rem;
      height: 56px;
      display: flex;
      align-items: center;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color .15s, border-color .15s;
    }
    nav a:hover { color: #f0e6d0; }
    nav a.active { color: #8fbfdf; border-bottom-color: #2e7bb4; }

    /* ── Layout ── */
    main { max-width: 820px; margin: 2.5rem auto; padding: 0 1.25rem; }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 1.5rem;
      letter-spacing: -.01em;
    }

    h2.section {
      font-family: 'Space Grotesk', sans-serif;
      font-size: .95rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: .02em;
      text-transform: uppercase;
      margin-bottom: .5rem;
    }

    /* ── Cards ── */
    .card {
      background: var(--card);
      border-radius: 6px;
      padding: 1.5rem 1.75rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--card-border);
      /* subtle inner top line like a printed form */
      border-top: 3px solid var(--border);
    }

    .card-desc {
      color: var(--muted);
      font-size: .9rem;
      margin-bottom: 1.2rem;
    }

    /* ── Buttons ── */
    .btn, .btn-cta, .btn-danger {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .48rem 1.15rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background .15s, transform .1s;
    }
    .btn       { background: #2c1f0e; color: #f0e6d0; }
    .btn:hover { background: #1a1208; }
    .btn-cta         { background: var(--cta); color: #fff; }
    .btn-cta:hover   { background: var(--cta-dark); }
    .btn-danger      { background: var(--danger); color: #fff; }
    .btn-danger:hover{ background: var(--danger-dark); }
    .btn:active, .btn-cta:active, .btn-danger:active { transform: scale(.97); }
    .btn:disabled, .btn-cta:disabled { opacity: .55; cursor: not-allowed; transform: none; }

    /* ── Forms ── */
    input[type="text"], textarea, select {
      font-family: inherit;
      font-size: .9rem;
      color: var(--text);
      background: #f0ead8;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: .5rem .75rem;
      transition: border-color .15s, box-shadow .15s;
      width: 100%;
    }
    input[type="text"]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(46,123,180,.15);
    }

    label.field-label {
      display: block;
      font-size: .72rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-bottom: .4rem;
    }

    /* ── Alerts ── */
    .alert {
      padding: .7rem 1rem;
      border-radius: 4px;
      font-size: .875rem;
      font-weight: 500;
      margin-bottom: 1rem;
      border-left: 3px solid;
    }
    .alert-success { background: #d6eddf; color: #1a4d30; border-color: var(--success); }
    .alert-error   { background: #f2d8d8; color: #5a1010; border-color: var(--danger); }

    .error { color: var(--danger); font-size: .875rem; margin-bottom: .75rem; }

    /* ── Drop zone ── */
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 6px;
      padding: 2.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      margin-bottom: 1.2rem;
      background: rgba(255,250,240,.4);
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(46,123,180,.06);
    }
    .drop-zone p.dz-title { font-size: 1rem; color: var(--muted); margin-bottom: .4rem; }
    .drop-zone p.dz-sub   { font-size: .85rem; color: #9a8870; margin-bottom: 1rem; }

    /* ── Progress ── */
    .progress-wrap { margin-bottom: 1.2rem; }
    .progress-track {
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      height: 6px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 2px;
      transition: width .1s;
    }
    .progress-fill.done { background: var(--success); }
    .progress-text { font-size: .78rem; color: var(--muted); margin-top: .35rem; font-variant-numeric: tabular-nums; }

    /* ── Code ── */
    code {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: .82em;
      background: #e0d8c8;
      color: #1a5f96;
      padding: .1em .35em;
      border-radius: 3px;
    }

    pre {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: .82rem;
      line-height: 1.65;
      background: #1a1208;
      color: #d4c8a8;
      padding: 1.25rem;
      border-radius: 6px;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 480px;
      overflow-y: auto;
      border: 1px solid #3a2a10;
    }

    /* ── Logs ── */
    details { margin-bottom: 1rem; }
    details summary {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-top: 3px solid var(--border);
      border-radius: 6px;
      padding: .85rem 1.25rem;
      font-size: .8rem;
      font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: .04em;
      text-transform: uppercase;
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      gap: .6rem;
      box-shadow: var(--shadow);
      transition: background .15s;
    }
    details summary:hover { background: #ede6d5; }
    details[open] summary { border-radius: 6px 6px 0 0; border-bottom: none; }
    details summary::before { content: '▶'; font-size: .65rem; color: var(--accent); transition: transform .2s; }
    details[open] summary::before { transform: rotate(90deg); }
    details .log-body {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-top: none;
      border-radius: 0 0 6px 6px;
      padding: 1rem;
    }
  </style>
</head>
<body>
  <nav>
    <span class="brand">✈ Skydive Mesquite</span>
    <a href="/ui/" {% if request.path == '/ui/' %}class="active"{% endif %}>Dashboard</a>
    <a href="/ui/funjumper" {% if request.path.startswith('/ui/funjumper') %}class="active"{% endif %}>Fun Jumper</a>
    {% if is_admin %}
    <a href="/ui/tandem" {% if request.path.startswith('/ui/tandem') %}class="active"{% endif %}>Tandem</a>
    <a href="/ui/links" {% if request.path == '/ui/links' %}class="active"{% endif %}>Media Links</a>
    <a href="/ui/logs" {% if request.path == '/ui/logs' %}class="active"{% endif %}>Logs</a>
    {% endif %}
    <div style="margin-left:auto;display:flex;align-items:center;gap:1rem;">
      <span style="color:#6b7a8d;font-size:.78rem;font-weight:500;">{{ current_user }}</span>
      <a href="/ui/logout" style="color:#94a3b8;font-size:.78rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;padding:4px 10px;border:1px solid #2a3a50;border-radius:4px;transition:color .15s,border-color .15s;" onmouseover="this.style.color='#f8fafc';this.style.borderColor='#4a6a8a'" onmouseout="this.style.color='#94a3b8';this.style.borderColor='#2a3a50'">Sign out</a>
    </div>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
